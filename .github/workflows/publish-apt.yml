name: Publish Debian 13 APT repository

on:
  push:
    branches: [main]
    paths:
      - 'scripts/build-apt-repo.sh'
      - '.github/workflows/publish-apt.yml'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download Debian packages from the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p packages
          mapfile -t release_tags < <(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name')
          for release_tag in "${release_tags[@]}"; do
            mapfile -t deb_assets < <(gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" \
              --json assets --jq '.assets[].name | select(endswith(".deb"))')
            if ((${#deb_assets[@]} > 0)); then
              gh release download "$release_tag" --repo "$GITHUB_REPOSITORY" \
                --pattern '*.deb' --dir packages --clobber
            fi
          done
          test -n "$(find packages -maxdepth 1 -type f -name '*.deb' -print -quit)"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Install repository tools
        run: sudo apt-get update && sudo apt-get install --yes apt-utils dpkg-dev gnupg

      - name: Build signed APT repository
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: ./scripts/build-apt-repo.sh site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
